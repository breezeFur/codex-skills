interface:
  display_name: "SellerSprite 市场调研"
  short_description: "调用 SellerSprite MCP 完成市场调研与 AI 分析"
  default_prompt: "使用 $sellersprite-market-research 调研这个亚马逊类目并给出有证据来源的进入建议。"

dependencies:
  tools:
    - type: "mcp"
      value: "sellersprite"
      description: "当前项目 SellerSprite API MCP；工具数量和名称以运行时发现结果为准。"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true
